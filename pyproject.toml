[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acemagic-ledctl"
version = "0.4.0"
description = "ACEMAGIC P9/P9 Plus (CH340) LED controller and pattern hacks"
readme = "README.md"
license = { text = "GPL 3.0 or later" }
authors = [{ name = "fsncps", email = "fsncps@eml.cc" }]
requires-python = ">=3.8"
dependencies = ["pyserial>=3.5"]
keywords = ["acemagic", "p9", "led", "ch340", "uart", "serial", "linux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Hardware :: Hardware Drivers",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/fsncps/acemagic-ledctl"
Repository = "https://github.com/fsncps/acemagic-ledctl.git"
Issues = "https://github.com/fsncps/acemagic-ledctl/issues"

[project.scripts]
ledctl = "ledctl.__main__:main"
ledctl-setmode = "ledctl.cli.setmode:main"
ledctl-off = "ledctl.cli.off:main"
ledctl-setpattern = "ledctl.cli.setpattern:main"
ledctl-wizard = "ledctl.cli.wizard:main"
ledctl-pattern-wiz = "ledctl.cli.pattern_wiz:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ledctl*"]
exclude = ["tests*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
